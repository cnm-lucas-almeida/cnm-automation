services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omie-validator-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped