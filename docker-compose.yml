services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnm-automation-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - auth_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  auth_data: